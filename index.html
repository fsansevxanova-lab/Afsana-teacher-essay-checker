<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afsana Teacher - Essay Checker</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  color:#172033;
}
.container{
  max-width:900px;
  margin:30px auto;
  padding:20px;
}
.card{
  background:white;
  border-radius:22px;
  padding:25px;
  box-shadow:0 10px 35px rgba(0,0,0,.10);
}
h1{
  text-align:center;
  color:#4f46e5;
  margin-bottom:5px;
}
.subtitle{
  text-align:center;
  color:#667085;
  margin-bottom:25px;
}
label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}
input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:12px;
  font-size:16px;
}
textarea{
  min-height:280px;
  resize:vertical;
}
button{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#4f46e5;
  color:white;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}
button:hover{background:#3730a3}
.result{
  display:none;
  margin-top:25px;
}
.score{
  text-align:center;
  background:#eef2ff;
  padding:20px;
  border-radius:15px;
}
.score-number{
  font-size:45px;
  font-weight:bold;
  color:#4f46e5;
}
.box{
  margin-top:15px;
  padding:17px;
  border-radius:14px;
  background:#f8fafc;
}
.box h3{
  margin-top:0;
  color:#4f46e5;
}

.bad{color:#b423
