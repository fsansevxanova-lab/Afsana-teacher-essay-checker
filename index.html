
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Əfsanə Teacher – Esse Yoxlama Sistemi</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#eef4ff,#f8fbff);
    color:#172033;
}

.container{
    max-width:850px;
    margin:30px auto;
    padding:20px;
}

.card{
    background:white;
    border-radius:20px;
    padding:28px;
    box-shadow:0 8px 30px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#3157d5;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#667085;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    margin:15px 0 7px;
}

select,textarea,input{
    width:100%;
    padding:13px;
    border:1px solid #d5dbea;
    border-radius:10px;
    font-size:16px;
}

textarea{
    min-height:250px;
    resize:vertical;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#3157d5;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    margin-top:18px;
    text-align:center;
    font-weight:bold;
}

.result{
    display:none;
    margin-top:25px;
    padding:20px;
    border-radius:15px;
    background:#f5f8ff;
}

.score{
    font-size:32px;
    font-weight:bold;
    text-align:center;
    color:#3157d5;
}

.result h3{
    margin-bottom:6px;
}

.error{
    color:#c62828;
}

.success{
    color:#16803c;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:#777;
    font-size:13px;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Əfsanə Teacher</h1>

<div class="subtitle">
Esse Yoxlama Sistemi
</div>

<label for="grade">Sinif</label>

<select id="grade">
<option value="11">11-ci sinif – Opinion Essay</option>
<option value="9">9-cu sinif – Picture Description</option>
</select>

<label for="topic">Mövzu</label>

<input
id="topic"
type="text"
placeholder="Mövzunu yazın"
>

<label for="essay">Esseni daxil edin</label>

<textarea
id="essay"
placeholder="Esseni buraya yazın..."
></textarea>

<button id="checkBtn">
Esseni yoxla
</button>

<div id="status"></div>

<div id="result" class="result">

<div class="score" id="score"></div>

<h3>Ümumi qiymətləndirmə</h3>
<p id="overall"></p>

<h3>Grammar</h3>
<p id="grammar"></p>

<h3>Vocabulary</h3>
<p id="vocabulary"></p>

<h3>Content</h3>
<p id="content"></p>

<h3>Organization</h3>
<p id="organization"></p>

<h3>Səhvlər və düzəlişlər</h3>
<p id="corrections"></p>

<h3>Məsləhət</h3>
<p id="advice"></p>

</div>

<div class="footer">
© Əfsanə Teacher
</div>

</div>
</div>

<script>

const WORKER_URL =
"https://SENIN-WORKER-LINKIN.workers.dev";

const button =
document.getElementById("checkBtn");

button.addEventListener("click", async () => {

const grade =
document.getElementById("grade").value;

const topic =
document.getElementById("topic").value.trim();

const essay =
document.getElementById("essay").value.trim();

const status =
document.getElementById("status");

const result =
document.getElementById("result");

if(!essay){

status.className="error";
status.textContent="Zəhmət olmasa esseni daxil edin.";
return;

}

if(WORKER_URL.includes("SENIN-WORKER-LINKIN")){

status.className="error";
status.textContent=
"Əvvəlcə Worker linkini kodda dəyişmək lazımdır.";
return;

}

button.disabled=true;
status.className="";
status.textContent="Esse yoxlanılır...";

result.style.display="none";

try{

const response = await fetch(WORKER_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

grade:grade,
topic:topic,
essay:essay

})

});

if(!response.ok){

throw new Error("Server xətası");

}

const data =
await response.json();

if(data.error){

throw new Error(data.error);

}

document.getElementById("score").textContent =
data.score + " / 20";

document.getElementById("overall").textContent =
data.overall || "";

document.getElementById("grammar").textContent =
data.grammar || "";

document.getElementById("vocabulary").textContent =
data.vocabulary || "";

document.getElementById("content").textContent =
data.content || "";

document.getElementById("organization").textContent =
data.organization || "";

document.getElementById("corrections").textContent =
data.corrections || "";

document.getElementById("advice").textContent =
data.advice || "";

result.style.display="block";

status.className="success";
status.textContent="Esse uğurla yoxlanıldı.";

}catch(error){

console.error(error);

status.className="error";

status.textContent=
"Xəta baş verdi. Bir neçə saniyə sonra yenidən cəhd edin.";

}finally{

button.disabled=false;

}

});

</script>

</body>
</html>
